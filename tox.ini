[tox]
# Tox configuration for VMstore Cinder Driver
# Follows OpenStack's standard tox configuration patterns

envlist = py{38,39,310,311},pep8,pylint,syntax
minversion = 4.0.0
skipsdist = True

[testenv]
# Standalone driver validation (inner loop testing)
usedevelop = True
setenv =
    VIRTUAL_ENV={envdir}
    PYTHONWARNINGS=default::DeprecationWarning
    VMSTORE_REST_PROTOCOL=http
    VMSTORE_REST_ADDRESS=localhost
    VMSTORE_REST_PORT=8080
    VMSTORE_REST_USERNAME=admin
    VMSTORE_REST_PASSWORD=admin
    NFS_SHARE=127.0.0.1:/export
deps =
    requests>=2.31.0
    mock>=5.0.0
commands =
    python3 test/scripts/standalone_driver_test.py {posargs}

[testenv:pep8]
# PEP8 style checks (OpenStack standard)
deps =
    hacking>=6.0.0  # OpenStack style checker (wraps flake8)
    flake8>=6.0.0
    flake8-import-order>=0.18
    pycodestyle>=2.10.0
commands =
    flake8 {toxinidir}/*.py {posargs}

[testenv:pylint]
# Pylint checks for additional code quality
deps =
    pylint>=2.17.0
    requests>=2.31.0
    mock>=5.0.0
commands =
    pylint {toxinidir}/*.py --rcfile={toxinidir}/.pylintrc --exit-zero {posargs}

[testenv:syntax]
# Syntax validation only (fastest check)
deps =
commands =
    python3 -m py_compile {toxinidir}/nfs.py
    python3 -m py_compile {toxinidir}/api.py
    python3 -m py_compile {toxinidir}/utils.py
    python3 -m py_compile {toxinidir}/options.py

[testenv:venv]
# Virtual environment for development
deps =
    requests>=2.31.0
    mock>=5.0.0
commands = {posargs}

[flake8]
# Flake8 configuration (OpenStack standard)
# E123, E125 skipped as they are invalid PEP-8
# W503, W504 line break before/after binary operator
show-source = True
ignore = E123,E125,E226,E305,W503,W504
builtins = _
exclude = 
    .venv,
    .git,
    .tox,
    dist,
    doc,
    *lib/python*,
    *egg,
    build,
    __pycache__,
    test/fixtures,
    test/mocks,
    test/scripts
# H203: Use assertIs(Not)None to check for None
# H204: Use assert(Not)Equal to check for equality  
# H205: Use assert(Greater|Less)(Equal) for comparison
enable-extensions = H203,H204,H205
max-complexity = 25
max-line-length = 127
import-order-style = pep8
