name: Public repo guard

# This repository is public. Block changes that publish internal information
# (lab IPs and host names, lab UUIDs, ticket numbers, customer names, secrets).
# Never switch this to pull_request_target: it would run with secrets against
# untrusted fork code.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - master
      - 3.0.12-beta
      - '3.0.*'

permissions:
  contents: read

concurrency:
  group: public-repo-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan added lines, commit messages, PR title and body, secrets
        env:
          # Untrusted text goes through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Repository secret, one customer name per line or comma separated.
          # Empty on fork PRs; the guard prints a notice and skips that check.
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/ci/guard.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --gitleaks-image ghcr.io/gitleaks/gitleaks:v8.30.1
