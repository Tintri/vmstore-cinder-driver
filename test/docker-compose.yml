
services:
  # NFS Server for data path testing
  nfs-server:
    image: erichough/nfs-server:latest
    container_name: vmstore-nfs-test
    privileged: true
    environment:
      - NFS_EXPORT_0=/nfs/cinder *(rw,sync,no_subtree_check,no_root_squash,fsid=0)
    volumes:
      - nfs-data:/nfs/cinder
      - /lib/modules:/lib/modules:ro
    cap_add:
      - SYS_ADMIN
      - SYS_MODULE
    ports:
      - "2049:2049"
      - "111:111/tcp"
      - "111:111/udp"
      - "32765-32767:32765-32767/tcp"
      - "32765-32767:32765-32767/udp"
    networks:
      - vmstore-test

  # WireMock for VMstore API control path mocking
  wiremock:
    image: wiremock/wiremock:latest
    container_name: vmstore-api-mock
    ports:
      - "8080:8080"
    volumes:
      - ./mocks/wiremock:/home/wiremock
    command:
      - --verbose
      - --global-response-templating
    networks:
      - vmstore-test

networks:
  vmstore-test:
    driver: bridge

volumes:
  nfs-data:
    driver: local
