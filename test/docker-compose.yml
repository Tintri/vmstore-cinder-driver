services:
  tests:
    build:
      # Build context is the repo root so COPY has access to driver source files
      context: ..
      dockerfile: test/Dockerfile
      args:
        # Cinder branch to test against. Defaults to the release Platform9 PCD
        # ships; override with e.g. CINDER_REF=master docker compose ... build
        CINDER_REF: ${CINDER_REF:-stable/2025.1}
    environment:
      OS_TEST_TIMEOUT: "120"
      PYTHONDONTWRITEBYTECODE: "1"
