[pytest]
# Pytest configuration for VMstore Cinder Driver

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = unit integration

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Show warnings
    --strict-markers
    --strict-config
    # Coverage options (uncomment to enable)
    # --cov=..
    # --cov-report=term-missing
    # --cov-report=html

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require containers)
    slow: Slow tests (may take several seconds)
    api: Tests for API client module
    nfs: Tests for NFS driver module
    utils: Tests for utility functions

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage options
[coverage:run]
source = ..
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
